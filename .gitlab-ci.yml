stages:
  - mirror

mirror_to_codeberg_and_github:
  stage: mirror
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    - ssh-keyscan -H codeberg.org >> ~/.ssh/known_hosts
  script:
    - git remote add codeberg git@codeberg.org:aomiqaza/$CI_PROJECT_NAME.git || true
    - git push --force codeberg main:main || echo "Codeberg push completed"
